<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">Pytagoras med kvadrater på sidene</title>
<desc id="desc">En rettvinklet trekant med katetene a og b og hypotenusen c. Et kvadrat er tegnet ut fra hver av de tre sidene og merket med arealet a i andre, b i andre og c i andre.</desc>
<rect width="720" height="560" fill="white"/>
<!-- Right triangle -->
<polygon points="250,340 250,220 400,340" fill="#f3f4f6" stroke="#111827" stroke-width="3"/>
<path d="M250 318 H272 V340" fill="none" stroke="#111827" stroke-width="2.5"/>
<!-- Squares constructed outward on each side -->
<polygon points="250,220 130,220 130,340 250,340" fill="#e0e7ff" stroke="#111827" stroke-width="2.5"/>
<polygon points="250,340 400,340 400,490 250,490" fill="#dcfce7" stroke="#111827" stroke-width="2.5"/>
<polygon points="250,220 400,340 520,190 370,70" fill="#fef3c7" stroke="#111827" stroke-width="2.5"/>
<!-- Side labels -->
<text x="235" y="285" font-size="22" text-anchor="end" fill="#111827">b</text>
<text x="325" y="365" font-size="22" text-anchor="middle" fill="#111827">a</text>
<text x="335" y="245" font-size="22" fill="#111827">c</text>
<!-- Area labels -->
<text x="190" y="285" font-size="22" text-anchor="middle" fill="#111827">b²</text>
<text x="325" y="425" font-size="22" text-anchor="middle" fill="#111827">a²</text>
<text x="390" y="180" font-size="22" text-anchor="middle" fill="#111827">c²</text>
<text x="360" y="530" font-size="25" text-anchor="middle" font-weight="bold" fill="#111827">a² + b² = c²</text>
</svg>