<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-labelledby="title desc">
<title id="title">Pytagoras: kvadrater på sidene</title><desc id="desc">En rettvinklet trekant med katetene a og b og hypotenusen c, ved siden av tre kvadrater med areal a i andre, b i andre og c i andre.</desc>
<rect width="820" height="390" fill="white"/>
<polygon points="70,300 70,90 340,300" fill="#f3f4f6" stroke="#111827" stroke-width="4"/>
<path d="M70 275 H95 V300" fill="none" stroke="#111827" stroke-width="3"/>
<text x="52" y="200" font-size="24" text-anchor="end" fill="#111827">b</text><text x="205" y="330" font-size="24" text-anchor="middle" fill="#111827">a</text><text x="230" y="175" font-size="24" fill="#111827">c</text>
<text x="470" y="55" font-size="20" text-anchor="middle" fill="#111827">Kvadratene på sidene</text>
<rect x="385" y="105" width="95" height="95" fill="none" stroke="#111827" stroke-width="3"/><text x="432" y="160" font-size="23" text-anchor="middle" fill="#111827">a²</text>
<text x="500" y="160" font-size="26" fill="#111827">+</text>
<rect x="535" y="105" width="95" height="95" fill="none" stroke="#111827" stroke-width="3"/><text x="582" y="160" font-size="23" text-anchor="middle" fill="#111827">b²</text>
<text x="645" y="160" font-size="26" fill="#111827">=</text>
<rect x="680" y="105" width="95" height="95" fill="none" stroke="#111827" stroke-width="3"/><text x="727" y="160" font-size="23" text-anchor="middle" fill="#111827">c²</text>
<text x="580" y="260" font-size="21" text-anchor="middle" fill="#111827">Arealet av kvadratet på</text><text x="580" y="288" font-size="21" text-anchor="middle" fill="#111827">hypotenusen er summen av</text><text x="580" y="316" font-size="21" text-anchor="middle" fill="#111827">arealene på katetene.</text>
<text x="410" y="365" font-size="23" text-anchor="middle" font-weight="bold" fill="#111827">a² + b² = c²</text>
</svg>